[project]
name = "jobpilot"
version = "0.1.0"
description = "Unified AI job search and application automation platform"
requires-python = ">=3.11"
dependencies = [
    # Core
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # CLI
    "typer>=0.12",
    # Browser automation. Playwright only — the Selenium path was retired.
    "playwright>=1.44",
    # Parsing
    "lxml>=5.2",
    "cssselect>=1.2",
    # AI / RAG. Local-first via Ollama; no API key required.
    "langchain-core>=0.2",
    "langchain-ollama>=0.1",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    # Google
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.126",
    # MCP
    "mcp>=1.0",
]

[project.optional-dependencies]
# Only needed when DATABASE_URL points at Postgres; SQLite needs no driver.
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
jobpilot = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "browser: needs a real browser",
    "latex: needs a LaTeX toolchain",
]
